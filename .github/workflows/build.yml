name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v1
      - run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install TFT_eSPI
          mkdir -p WAVE125i_WORKING
          mv WAVE125i_WORKING.ino WAVE125i_WORKING/WAVE125i_WORKING.ino || cp WAVE125i_WORKING.ino WAVE125i_WORKING/
          mkdir -p build
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build WAVE125i_WORKING --verbose
          ls build
      - uses: actions/upload-artifact@v4
        with:
          name: WAVE125i-Ultimate-BIN
          path: build
