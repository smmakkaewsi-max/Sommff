name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          sketch-paths: |
            .
          fqbn: esp32:esp32:esp32
          libraries: |
            - name: TFT_eSPI
      - name: Upload BIN
        uses: actions/upload-artifact@v4
        with:
          name: WAVE125i-Ultimate-BIN
          path: |
            **/*.bin
